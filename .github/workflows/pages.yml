name: Build and publish blog to Aliyun

on:
  push:
    branches: [hexo]
  pull_request:
    branches: [hexo]
  discussion:
    types: [created, edited, deleted, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify publication artifacts
        run: npm test
      - name: Build GitHub Pages redirects preserving old paths
        run: npm run build:redirects
      - name: Verify deployment archive isolation and rollback
        run: python3 -m unittest discover -s deploy/aliyun -p 'test_*.py'
      - name: Refresh giscus comment counts
        if: github.event_name != 'pull_request'
        run: npm run sync:comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check for critical dependency advisories
        run: npm audit --audit-level=critical
      - name: Publish isolated Aliyun blog and verify both sites
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hexo'
        run: bash tooling/publish-aliyun.sh
        env:
          BLOG_DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
          BLOG_KNOWN_HOSTS: ${{ secrets.BLOG_KNOWN_HOSTS }}
      - name: Upload Pages redirect artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hexo'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .deploy-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/hexo'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

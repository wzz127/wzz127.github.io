# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: k-fad 的博客
subtitle: 欢迎到访~
description: 记录 sanxing 等 AI 小项目、工作心得与日常生活，也留着早期的 Hadoop 学习笔记。
keywords: Hadoop, Hive, HBase, Impala, AI, 大数据
author: wzz
language: zh-CN
email: 369090561@qq.com
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://blog.kfad127.xyz
icp: 豫ICP备2026017642号-1
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true
  field: post
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category:
category_map:
    大数据: bigdata
    Hadoop: hadoop
    编程: programming
    生活: life
    其他: other
    sanxing: sanxing
    工作心得记录: work-notes
    日常生活: daily-life
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: yilia

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: git@github.com:wzz127/wzz127.github.io.git
  branch: master

# GitHub Pages 的自动发布见 .github/workflows/pages.yml。
# 上述 Git 部署仅供 npm run deploy:legacy 手动使用。
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true


# Yilia 的 content.json 由 scripts/search-index.js 生成。

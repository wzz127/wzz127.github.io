  <text x="110" y="75" fill="#8d8679" font-family="Arial, sans-serif" font-size="12" letter-spacing="4">NOTE</text>
  <g fill="#1e1d19" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="60">
